name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # builds everything, examples included, and runs the kernel tests; the
  # examples need a model, so they are only built
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # NEON + Metal
          - os: ubuntu-latest # AVX2, picked at run time
          - os: ubuntu-24.04-arm # NEON without Metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --all-targets
      - run: cargo test --workspace --release

  # the oldest Rust the manifests accept (rust-version); on aarch64, where the
  # NEON dot product intrinsics set it
  msrv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --all-targets

  # the engine without std: alloc and libm only, on a bare-metal target
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p biv --no-default-features --target thumbv7m-none-eabi
